name: One-time MyQuiz production sync

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push verified branch without temporary workflow
        env:
          MYQUIZ_SYNC_TOKEN: ${{ secrets.MYQUIZ_SYNC_TOKEN }}
        run: |
          git config user.name "MyQuiz Sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add production "https://x-access-token:${MYQUIZ_SYNC_TOKEN}@github.com/samyamkhadka07/myquiz-production.git"
          git rm .github/workflows/sync-myquiz-production.yml
          git commit -m "Sync verified MyQuiz production tree"
          git push production HEAD:main
